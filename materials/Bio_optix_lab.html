<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>BioOptix Lab - Direct Launch</title>
    <style>
        body { margin: 0; background: #05070a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        /* ЗОНА ЗА ВИЗУАЛИЗАЦИЯ */
        .display { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .box { background: #000; border: 2px solid #333; border-radius: 10px; position: relative; overflow: hidden; }
        .white { background: #fff; display: flex; justify-content: center; align-items: center; }

        .snellen { color: #000; font-weight: bold; text-align: center; line-height: 0.9; pointer-events: none; }

        /* ПАНЕЛ ЗА УПРАВЛЕНИЕ */
        .ui { height: 220px; background: #111827; border-top: 3px solid #00f2fe; padding: 15px; display: grid; grid-template-columns: 250px 1fr 250px; gap: 15px; }
        .card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px solid #333; }
        
        .btn { width: 100%; padding: 10px; margin-bottom: 5px; background: #1f2937; color: #fff; border: 1px solid #4b5563; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn.active { background: #00f2fe; color: #000; }
        
        input[type="range"] { width: 100%; cursor: pointer; margin-top: 10px; }
        #val-box { font-size: 2rem; color: #00f2fe; font-weight: bold; text-align: center; }
    </style>
</head>
<body onload="init()">

<div class="display">
    <div class="box white">
        <div id="chart" class="snellen">
            <div style="font-size: 80px;">E</div>
            <div style="font-size: 50px;">F P</div>
            <div style="font-size: 35px;">T O Z</div>
            <div style="font-size: 25px;">L P E D</div>
            <div style="font-size: 18px;">P E C F D</div>
        </div>
    </div>
    <div class="box">
        <canvas id="canvas"></canvas>
    </div>
</div>

<div class="ui">
    <div class="card">
        <div style="color:#00f2fe; font-size: 0.7rem; margin-bottom: 5px;">ДИАГНОЗА</div>
        <button id="nBtn" class="btn active" onclick="changeMode('normal', this)">NORMAL</button>
        <button id="mBtn" class="btn" onclick="changeMode('myopia', this)">MYOPIA (-)</button>
        <button id="hBtn" class="btn" onclick="changeMode('hyper', this)">HYPER (+)</button>
    </div>

    <div class="card">
        <div style="color:#00f2fe; font-size: 0.7rem; text-align: center;">КОРЕКЦИЯ</div>
        <div id="val-box">0.00 D</div>
        <input type="range" id="slider" min="-6" max="6" step="0.25" value="0" oninput="run()">
    </div>

    <div class="card">
        <div style="color:#00f2fe; font-size: 0.7rem; margin-bottom: 5px;">АНАЛИЗ</div>
        <div id="info" style="font-size: 0.8rem; color: #9ca3af; line-height: 1.3;">
            Здраво око. Фокусът е върху ретината.
        </div>
    </div>
</div>

<script>
    let mode = 'normal';
    const c = document.getElementById('canvas');
    const ctx = c.getContext('2d');

    function init() {
        window.addEventListener('resize', run);
        run();
    }

    function changeMode(m, b) {
        mode = m;
        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('slider').value = 0;
        run();
    }

    function run() {
        const d = parseFloat(document.getElementById('slider').value);
        document.getElementById('val-box').innerText = (d > 0 ? "+" : "") + d.toFixed(2) + " D";
        
        // 1. Изчисляване на размазването
        let b = 0;
        if(mode === 'myopia') b = Math.abs(12 + (d * 4));
        else if(mode === 'hyper') b = Math.abs(10 - (d * 4));
        else b = Math.abs(d * 4);
        
        document.getElementById('chart').style.filter = `blur(${b}px)`;
        document.getElementById('info').innerText = (b < 1) ? "Образът е коригиран!" : "Търсете фокусната точка.";

        // 2. Рисуване на графиката
        c.width = c.offsetWidth;
        c.height = c.offsetHeight;
        const x = c.width/2, y = c.height/2, r = 80;

        ctx.clearRect(0,0,c.width,c.height);
        
        // Форма на окото
        let s = (mode === 'myopia') ? 1.3 : (mode === 'hyper') ? 0.8 : 1;
        ctx.beginPath();
        ctx.strokeStyle = '#4b5563';
        ctx.lineWidth = 3;
        ctx.ellipse(x, y, r * s, r, 0, 0, Math.PI*2);
        ctx.stroke();

        // Ретина
        ctx.beginPath();
        ctx.arc(x + (r * s) - 4, y, 25, Math.PI/2, -Math.PI/2, true);
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Фокус
        let fx = x + (r * (mode === 'myopia' ? 0.6 : mode === 'hyper' ? 1.3 : 0.95)) - (d * 10);
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 1;
        for(let i=-2; i<=2; i++) {
            ctx.beginPath();
            ctx.moveTo(x-200, y + i*20);
            ctx.lineTo(x - (r*0.8), y + i*20);
            ctx.lineTo(fx, y);
            ctx.stroke();
        }

        // Точка
        ctx.beginPath();
        ctx.arc(fx, y, 5, 0, Math.PI*2);
        ctx.fillStyle = (Math.abs(fx - (x + r*s)) < 12) ? '#10b981' : '#ef4444';
        ctx.fill();
    }
</script>
</body>
</html>
