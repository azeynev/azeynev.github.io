<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Vision Master Academic v7.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --bg: #020617; --panel: rgba(15, 23, 42, 0.95);
            --accent: #00f2ff; --green: #22c55e; --red: #ef4444; --purple: #a855f7;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: white; }

        /* Background Reality */
        #vision-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1516116216624-53e697fedbea?w=1920&q=80');
            background-size: cover; background-position: center; z-index: 1; transition: filter 0.4s ease;
        }

        /* Control HUD */
        #hud {
            position: absolute; top: 20px; left: 20px; width: 350px;
            background: var(--panel); padding: 25px; border-radius: 15px;
            border: 1px solid rgba(0, 242, 255, 0.3); backdrop-filter: blur(15px);
            z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h2 { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--accent); text-align: center; margin-bottom: 20px; letter-spacing: 2px; border-bottom: 1px solid rgba(0,242,255,0.2); padding-bottom: 10px; }

        .group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: #58ccff; margin-bottom: 6px; font-weight: bold; }

        select, button {
            width: 100%; padding: 12px; margin-bottom: 10px; background: #0f172a;
            border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        /* Academic Info Panel */
        #info-panel {
            background: rgba(0, 242, 255, 0.05); border-radius: 8px; padding: 15px;
            font-size: 0.85rem; line-height: 1.4; border-left: 3px solid var(--accent);
            min-height: 100px; margin-top: 10px;
        }
        #info-title { color: var(--accent); font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }

        /* Anatomy Model */
        #comparison { position: absolute; bottom: 30px; right: 30px; z-index: 100; }
        .eye-card { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        canvas { display: block; }
        .flash { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; opacity: 0; pointer-events: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="vision-bg"></div>
<div class="flash" id="flash"></div>

<div id="hud">
    <h2>VISION ACADEMY v7.0</h2>
    
    <div class="group">
        <label>ДИАГНОЗА (СЪСТОЯНИЕ):</label>
        <select id="defect" onchange="runSim()">
            <option value="none">Еметропия (Нормално зрение)</option>
            <option value="myopia">Миопия (Късогледство)</option>
            <option value="hyperopia">Хиперметропия (Дългогледство)</option>
            <option value="astigmatism">Астигматизъм (Деформация)</option>
        </select>
    </div>

    <div class="group">
        <label>МЕТОД НА КОРЕКЦИЯ:</label>
        <select id="lens" onchange="runSim()">
            <option value="none">Без корекция</option>
            <option value="concave">Вдлъбната леща (Разсейваща)</option>
            <option value="convex">Изпъкнала леща (Събираща)</option>
            <option value="cyl">Цилиндрична леща</option>
        </select>
    </div>

    <div id="info-panel">
        <div id="info-title">Описание</div>
        <div id="info-text">Изберете състояние, за да видите академичното обяснение тук.</div>
    </div>

    <button onclick="applyLasik()" style="margin-top: 20px; border-color: var(--purple); color: var(--purple);">ПРИЛОЖИ LASIK ОПЕРАЦИЯ</button>
</div>

<div id="comparison">
    <div class="eye-card">
        <div style="font-size: 0.7rem; color: #888; margin-bottom: 10px; font-family: 'Orbitron';">ОПТИЧЕН ТРАЙСИНГ (РЕАЛНО ВРЕМЕ)</div>
        <canvas id="eyeCanvas" width="300" height="160"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('eyeCanvas');
    const ctx = canvas.getContext('2d');
    let isLasik = false;

    const academicData = {
        none: { title: "Еметропия", text: "Светлинните лъчи се фокусират точно върху ретината. Окото има идеална сферична форма и пречупвателна сила." },
        myopia: { title: "Миопия", text: "Очната ябълка е прекалено дълга. Образът се фокусира пред ретината. Необходима е вдлъбната (минус) леща, която да разсее лъчите." },
        hyperopia: { title: "Хиперметропия", text: "Очната ябълка е прекалено къса. Фокусът пада зад ретината. Необходима е изпъкнала (плюс) леща, която да събере лъчите по-рано." },
        astigmatism: { title: "Астигматизъм", text: "Неправилна кривина на роговицата. Светлината се фокусира в няколко точки, вместо в една. Коригира се с цилиндрични лещи." }
    };

    function runSim() {
        const defect = document.getElementById('defect').value;
        const lens = document.getElementById('lens').value;
        const bg = document.getElementById('vision-bg');
        
        let correct = (defect === 'none');
        if (defect === 'myopia' && lens === 'concave') correct = true;
        if (defect === 'hyperopia' && lens === 'convex') correct = true;
        if (defect === 'astigmatism' && lens === 'cyl') correct = true;
        if (isLasik) correct = true;

        bg.style.filter = correct ? "blur(0px)" : "blur(12px)";
        
        document.getElementById('info-title').innerText = academicData[defect].title;
        document.getElementById('info-text').innerText = academicData[defect].text;

        drawEye(defect, lens, correct);
    }

    function drawEye(defect, lens, correct) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cy = 80;

        // Око
        ctx.beginPath();
        ctx.ellipse(220, cy, 65, 55, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.stroke();

        // Очила
        if (lens !== 'none') {
            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#00f2ff";
            if (lens === 'concave') { ctx.moveTo(60, 50); ctx.quadraticCurveTo(80, 80, 60, 110); }
            else if (lens === 'convex') { ctx.moveTo(80, 50); ctx.quadraticCurveTo(60, 80, 80, 110); }
            else { ctx.strokeRect(70, 50, 6, 60); }
            ctx.stroke();
        }

        // Лъчи
        ctx.lineWidth = 1;
        let yInTop = 60, yInBot = 100;
        if (lens === 'concave') { yInTop = 50; yInBot = 110; }
        if (lens === 'convex') { yInTop = 70; yInBot = 90; }

        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.moveTo(10, 60); ctx.lineTo(150, yInTop);
        ctx.moveTo(10, 100); ctx.lineTo(150, yInBot);
        ctx.stroke();

        // Фокусна точка
        let fx = 285; // Ретина
        if (!correct) {
            if (defect === 'myopia') fx = 190;
            if (defect === 'hyperopia') fx = 330;
        }

        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.moveTo(150, yInTop); ctx.lineTo(fx, cy);
        ctx.moveTo(150, yInBot); ctx.lineTo(fx, cy);
        ctx.strokeStyle = correct ? "#22c55e" : "#ef4444";
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(fx, cy, 6, 0, Math.PI * 2);
        ctx.fillStyle = correct ? "#22c55e" : "#ef4444";
        ctx.fill();
    }

    function applyLasik() {
        const f = document.getElementById('flash');
        f.style.opacity = "1";
        setTimeout(() => {
            isLasik = true;
            f.style.opacity = "0";
            document.getElementById('lens').value = "none";
            runSim();
        }, 300);
    }

    runSim();
</script>
</body>
</html>
