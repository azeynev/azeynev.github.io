<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФИНАЛНА ВЕРСИЯ: Реалистичен Тотализатор с Тръба Отдясно</title>

    <style>
        /* ==================================== */
        /* 1. СТИЛОВЕ (CSS) - РЕАЛИЗЪМ И 3D */
        /* ==================================== */

        :root {
            --primary-color: #f1c40f; 
            --secondary-color: #2c3e50;
            --success-color: #2ecc71; 
            --bg-color: #1c2833;
            --card-bg: #34495e;
            --ball-color-drawn: #f1c40f; 
            --ball-color-base: #c0392b; 
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            perspective: 2000px; 
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.7);
            margin-bottom: 20px;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }
        
        #info-banner {
            width: 80%;
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 15px;
            background-color: #2e4358;
            border-radius: 8px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--success-color);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }

        /* ************************************ */
        /* 3D СФЕРА И ТРЪБА */
        /* ************************************ */
        #sphere-section {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 450px;
            position: relative;
        }

        #platform {
            position: absolute;
            bottom: 0;
            width: 600px;
            height: 50px;
            background-color: #1a1a1a;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.9);
            z-index: 10;
        }

        #lottery-sphere {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle at 100px 100px, rgba(255, 255, 255, 0.99) 0%, rgba(52, 152, 219, 0.4) 40%, rgba(41, 128, 185, 0.5) 100%);
            box-shadow: 
                0 0 80px rgba(52, 152, 219, 0.8), 
                inset 0 0 100px rgba(255, 255, 255, 0.4), 
                inset 0 0 120px rgba(0, 0, 0, 0.9); 
            position: absolute;
            top: 50px;
            z-index: 20;
            transform-style: preserve-3d;
            border: 8px solid rgba(255, 255, 255, 0.6);
            overflow: hidden; 
        }
        
        /* Симулация на 49 топки вътре (без промяна) */
        #ball-container-49 {
            width: 100%; height: 100%; position: absolute; transform-style: preserve-3d;
        }
        .inner-ball-simulation {
            width: 300px; height: 300px; position: absolute; top: 25px; left: 25px; border-radius: 50%;
            box-shadow: 
                0 0 10px 5px var(--ball-color-base), 10px 10px 15px 5px rgba(255, 0, 0, 0.6),
                -15px -15px 20px 5px rgba(255, 0, 0, 0.6), 25px -25px 18px 4px rgba(255, 0, 0, 0.5),
                -30px 5px 22px 5px rgba(255, 0, 0, 0.7);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, var(--ball-color-base) 60%, rgba(150, 0, 0, 1) 100%);
            animation: chaotic-spin 5s infinite linear;
            z-index: 25;
        }
        
        @keyframes chaotic-spin {
            0% { transform: rotateX(0deg) rotateY(0deg) translateZ(0px); }
            50% { transform: rotateX(180deg) rotateY(120deg) translateZ(5px); }
            100% { transform: rotateX(360deg) rotateY(360deg) translateZ(0px); }
        }
        @keyframes spin {
            from { transform: rotateY(0deg) rotateX(0deg); }
            to { transform: rotateY(360deg) rotateX(360deg); }
        }
        .spinning #ball-container-49 {
            animation: chaotic-spin 5s infinite linear;
        }
        .spinning {
            animation: spin 3s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        
        /* ИЗХОДЕН ТУНЕЛ (ТРЪБА) - КОРИГИРАНА ЗА ДЯСНА ПОЗИЦИЯ */
        #outlet-pipe {
            position: absolute;
            width: 150px;
            height: 60px;
            background: linear-gradient(to left, #ccc, #eee, #ccc); /* Градиент отдясно наляво */
            border-radius: 0 30px 30px 0; /* Огледално огъване */
            transform: translateY(-20px) rotate(-10deg); /* Огледална ротация */
            left: 250px; /* Позициониране отляво на сферата */
            top: 200px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 15;
            transition: all 0.3s ease; 
            overflow: visible; 
        }
        
        /* ************************************ */
        /* АНИМИРАНА ТРАНЗИТНА ТОПКА - КОРИГИРАНА ЗА ДЯСНА ПОЗИЦИЯ */
        /* ************************************ */
        
        #pipe-transit-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .pipe-transit-ball {
            position: absolute;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            color: white;
            border-radius: 50%;
            background-color: var(--ball-color-base);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(255, 255, 255, 0.8);
            
            /* Начална позиция: отдясно, където започва тръбата */
            left: 400px; /* Позициониране спрямо #sphere-section (350px сфера + 50px за тръбата) */
            top: 200px;
            z-index: 35;
            opacity: 0; 
        }

        .pipe-transit-ball.active {
            opacity: 1;
            animation: transit-ball-movement 1.4s ease-in-out forwards;
        }

        /* КЛЮЧОВА ПРОМЯНА: АНИМАЦИЯ НАДЯСНО */
        @keyframes transit-ball-movement {
            /* Започва от сферата, горе-дясно на тръбата */
            0%   { transform: translate(100px, -50px) rotate(0deg); opacity: 1; } 
            
            /* Преминава през тръбата (обратна ротация) */
            50%  { transform: translate(-50px, -10px) rotate(-50deg); } 
            
            /* Излиза от тръбата и пада към платформата (по-надясно, по-ниско) */
            100% { transform: translate(-150px, 150px) scale(0.8) rotate(-180deg); opacity: 0; } 
        }
        
        /* Изтеглени числа (под сферата) */
        #drawn-balls-display {
            position: absolute;
            bottom: 55px;
            display: flex;
            justify-content: center;
            width: 100%;
            z-index: 30;
            min-height: 80px;
        }

        .drawn-ball {
            width: 70px; height: 70px; line-height: 70px; background-color: var(--ball-color-drawn);
            color: var(--secondary-color); border-radius: 50%; font-size: 1.8em; font-weight: bold;
            margin: 0 5px; box-shadow: 0 0 30px var(--primary-color), inset 0 0 10px rgba(255, 255, 255, 0.7);
            transform: scale(0); animation: ball-pop 0.3s ease-out forwards; 
        }
        .drawn-ball.match {
             background-color: var(--success-color); color: white;
             box-shadow: 0 0 30px var(--success-color), inset 0 0 10px rgba(255, 255, 255, 0.7);
        }

        @keyframes ball-pop {
            0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); }
        }
        
        /* ... (Стиловете за grid-number и controls остават същите) ... */
        #grid-container {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; max-width: 700px; margin: 15px auto;
        }
        .grid-number {
            padding: 10px 0; text-align: center; background-color: #465a6f; border-radius: 6px;
            cursor: pointer; transition: background-color 0.2s, transform 0.1s; font-weight: bold;
        }
        .grid-number.selected {
            background-color: var(--success-color); color: white; transform: scale(1.1);
        }
        
    </style>
</head>
<body>

    <div class="container">
        <h1>ФИНАЛНА ВЕРСИЯ: Реалистичен Тотализатор с Тръба Отдясно</h1>
        
        <div id="info-banner">
            <span id="match-count">MATCHES: 0 (***0-ка***)</span>
        </div>

        <div id="sphere-section">
            <div id="platform"></div>
            
            <div id="pipe-transit-container"></div> 
            
            <div id="lottery-sphere">
                <div id="ball-container-49">
                    <div class="inner-ball-simulation"></div>
                </div>
            </div>
            <div id="outlet-pipe"></div>
            <div id="drawn-balls-display"></div>
        </div>
        

        <div id="input-section">
            <h3>Изберете Вашата Комбинация (6 числа):</h3>
            <p id="selection-status">Избрани: 0 от 6</p>
            
            <div id="grid-container">
                </div>
            
            <div id="controls">
                <button onclick="clearSelection()" style="background-color: #3498db;">Изчисти</button>
                <button onclick="quickPick()" style="background-color: #9b59b6;">Случаен Избор</button>
                <button onclick="drawNumbers()" id="draw-btn" disabled>🚀 Тегли Числата!</button>
            </div>
        </div>
        
        <div id="info-section">
            <h2>📊 Вероятности (Образователен Аспект)</h2>
            <p>Общ брой възможни комбинации (6 от 49): <span id="total-combinations"></span></p>
            <p id="probability-display">Вероятност за 6-ца: </p>
        </div>
    </div>

    <script>
        const GRID_SIZE = 49;
        const PICK_COUNT = 6;
        const ANIMATION_DURATION = 1800; 
        
        const PRIMARY_COLOR = '#f1c40f'; 
        const SUCCESS_COLOR = '#2ecc71'; 

        const gridContainer = document.getElementById('grid-container');
        const selectionStatus = document.getElementById('selection-status');
        const drawNumbersDiv = document.getElementById('drawn-balls-display');
        const matchCountDisplay = document.getElementById('match-count');
        const drawButton = document.getElementById('draw-btn');
        const lotterySphere = document.getElementById('lottery-sphere');
        const outletPipe = document.getElementById('outlet-pipe');
        const transitContainer = document.getElementById('pipe-transit-container');
        const totalCombinationsDisplay = document.getElementById('total-combinations');
        const probabilityDisplay = document.getElementById('probability-display');


        let userSelection = [];
        let drawResult = [];
        let isDrawing = false;
        
        // --- Помощни функции за Комбинаторика и UI (съкратени) ---
        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) { result *= i; }
            return result;
        }

        function calculateCombinations(n, k) {
            if (k < 0 || k > n) return 0;
            if (k > n / 2) k = n - k;
            let numerator = 1;
            for (let i = 0; i < k; i++) { numerator *= (n - i); }
            return numerator / factorial(k);
        }
        
        function calculateProbability(m) {
            const n = 49; const k = 6;
            if (m < 0 || m > k) return "Невъзможно";
            const totalCombinations = calculateCombinations(n, k);
            const matchedCombinations = calculateCombinations(k, m);
            const unmatchedCombinations = calculateCombinations(n - k, k - m);
            const favorableOutcomes = matchedCombinations * unmatchedCombinations;
            const probDecimal = (favorableOutcomes / totalCombinations * 100).toFixed(6);
            if (m === 6) { return `1 към ${totalCombinations.toLocaleString('bg-BG')} (${probDecimal}%)`; } 
            else if (m >= 4) { return `${favorableOutcomes.toLocaleString('bg-BG')} към ${totalCombinations.toLocaleString('bg-BG')} (${probDecimal}%)`; } 
            else { return `${probDecimal}%`; }
        }

        function generateUniqueRandomNumbers(n, k) {
            const numbers = Array.from({ length: n }, (_, i) => i + 1);
            const drawn = [];
            for (let i = 0; i < k; i++) {
                const randomIndex = Math.floor(Math.random() * numbers.length);
                drawn.push(numbers[randomIndex]);
                numbers.splice(randomIndex, 1);
            }
            return drawn.sort((a, b) => a - b);
        }
        
        function updateStatus() {
            selectionStatus.textContent = `Избрани: ${userSelection.length} от ${PICK_COUNT}`;
            drawButton.disabled = userSelection.length !== PICK_COUNT || isDrawing;
        }

        function setupGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= GRID_SIZE; i++) {
                const numberDiv = document.createElement('div');
                numberDiv.className = 'grid-number';
                numberDiv.dataset.number = i;
                numberDiv.textContent = i;
                numberDiv.onclick = () => toggleSelection(i, numberDiv);
                gridContainer.appendChild(numberDiv);
            }
            updateStatus();
            const totalCombs = calculateCombinations(49, 6).toLocaleString('bg-BG');
            totalCombinationsDisplay.textContent = totalCombs;
            probabilityDisplay.innerHTML = `Вероятност за 6-ца: **${calculateProbability(6)}**`;
        }

        function toggleSelection(number, element) {
            if (isDrawing) return;
            const num = parseInt(number);
            const index = userSelection.indexOf(num);

            if (index > -1) {
                userSelection.splice(index, 1);
                element.classList.remove('selected');
            } else if (userSelection.length < PICK_COUNT) {
                userSelection.push(num);
                element.classList.add('selected');
            }
            userSelection.sort((a, b) => a - b);
            updateStatus();
        }

        function clearSelection() {
            if (isDrawing) return;
            userSelection = [];
            document.querySelectorAll('.grid-number').forEach(el => {
                el.classList.remove('selected');
            });
            drawNumbersDiv.innerHTML = '';
            matchCountDisplay.textContent = 'MATCHES: 0 (***0-ка***)';
            updateStatus();
        }

        function quickPick() {
            if (isDrawing) return;
            clearSelection();
            userSelection = generateUniqueRandomNumbers(GRID_SIZE, PICK_COUNT);
            
            userSelection.forEach(number => {
                const element = document.querySelector(`.grid-number[data-number="${number}"]`);
                if (element) {
                    element.classList.add('selected');
                }
            });
            updateStatus();
        }


        // ====================================
        // ГЛАВНА ФУНКЦИЯ ЗА ТЕГЛЕНЕ (С ВИДИМО ЧИСЛО В ТРЪБАТА)
        // ====================================

        function drawNumbers() {
            if (isDrawing || userSelection.length !== PICK_COUNT) return;
            
            isDrawing = true;
            drawButton.disabled = true;
            
            drawResult = generateUniqueRandomNumbers(GRID_SIZE, PICK_COUNT);
            drawNumbersDiv.innerHTML = '';
            matchCountDisplay.textContent = 'MATCHES: 0 (***0-ка***)';
            
            let matches = 0;

            // 1. Стартиране на въртенето
            lotterySphere.classList.add('spinning');
            outletPipe.style.boxShadow = `0 0 40px ${PRIMARY_COLOR}`;

            let drawIndex = 0;
            
            // Рекурсивна функция за последователно теглене
            function drawNextBall() {
                if (drawIndex >= PICK_COUNT) {
                    // Край на тегленето
                    lotterySphere.classList.remove('spinning');
                    outletPipe.style.boxShadow = `0 0 20px rgba(0, 0, 0, 0.5)`;
                    
                    setTimeout(() => {
                        // Финален резултат
                        matchCountDisplay.textContent = `MATCHES: ${matches} (***${matches}-ка***)`;
                        
                        const probText = calculateProbability(matches);
                        alert(`Тегленето приключи!\n\nРезултат: ${matches}-ка!\nВероятността за тази група е ${probText}.`);

                        isDrawing = false;
                        drawButton.disabled = false;
                        updateStatus();
                    }, 500);
                    return;
                }

                const number = drawResult[drawIndex];
                const isMatch = userSelection.includes(number);

                // 2. Създаване и активиране на транзитната топка (ЧЕРВЕНА, с НОМЕР)
                const transitBall = document.createElement('div');
                transitBall.className = 'pipe-transit-ball';
                transitBall.textContent = number;
                transitContainer.appendChild(transitBall);

                // Активиране на анимацията (добавяне на клас след добавяне към DOM)
                requestAnimationFrame(() => {
                    transitBall.classList.add('active');
                });
                
                // Анимация на тръбата
                outletPipe.style.transform = `translateY(-20px) rotate(-10deg) scale(1.1)`;
                
                // 3. Изчакваме анимацията на транзитната топка да приключи
                setTimeout(() => {
                    // Премахване на транзитната топка
                    transitContainer.removeChild(transitBall);
                    
                    // 4. Добавяне на финалната (ЗЛАТНА) топка към дисплея
                    const finalBall = document.createElement('div');
                    finalBall.className = `drawn-ball`;
                    finalBall.textContent = number;
                    
                    if (isMatch) {
                        finalBall.classList.add('match');
                        matches++;
                    }
                    
                    drawNumbersDiv.appendChild(finalBall);

                    // Актуализиране на банера
                    matchCountDisplay.textContent = `MATCHES: ${matches} (***${matches}-ка***)`;
                    
                    // Връщане на тръбата в нормално положение
                    outletPipe.style.transform = `translateY(-20px) rotate(-10deg) scale(1)`;

                    drawIndex++;
                    
                    // 5. Извикване на следващото теглене
                    drawNextBall();
                }, ANIMATION_DURATION);
            }

            // Стартира първото теглене
            drawNextBall(); 
        }

        // Инициализация при зареждане на страницата
        document.addEventListener('DOMContentLoaded', setupGrid);
    </script>
</body>
</html>
