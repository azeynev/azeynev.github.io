<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Geometry Universe | Full School Course</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --accent: #ffd700;
            --bg: #0b1120;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh; overflow-x: hidden;
        }

        canvas#bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; }

        header { text-align: center; padding: 40px 20px; }
        h1 { 
            font-size: 3rem; margin: 0; 
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 4px;
        }

        .container {
            max-width: 1400px; margin: 0 auto;
            display: grid; grid-template-columns: 320px 1fr; gap: 30px; padding: 20px;
        }

        .sidebar {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 25px;
            padding: 25px; height: fit-content; position: sticky; top: 20px;
        }

        .select-group { margin-bottom: 20px; }
        label { color: var(--primary); font-size: 11px; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px; }
        
        select {
            width: 100%; background: rgba(0,0,0,0.4); color: white;
            border: 1px solid var(--glass-border); padding: 12px;
            border-radius: 12px; cursor: pointer; outline: none;
        }

        .content-card {
            background: var(--glass); backdrop-filter: blur(30px);
            border-radius: 35px; padding: 40px; border: 1px solid var(--glass-border);
        }

        .visual-stage {
            height: 220px; background: rgba(0,0,0,0.2); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
        }

        .formula-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-top: 30px;
        }

        .f-card {
            background: rgba(255,255,255,0.03); padding: 25px;
            border-radius: 20px; border: 1px solid var(--glass-border); text-align: center;
        }

        .f-card span { display: block; font-size: 10px; color: var(--accent); text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        .mjx-chtml { font-size: 1.4rem !important; }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
    <h1>Geometry Universe</h1>
</header>

<div class="container">
    <div class="sidebar">
        <div class="select-group">
            <label>Категория</label>
            <select id="cat" onchange="updateSub()">
                <option value="tri">Триъгълници</option>
                <option value="quad">Четириъгълници</option>
                <option value="poly">Многоъгълници</option>
                <option value="circ">Кръг и части</option>
            </select>
        </div>
        <div class="select-group">
            <label>Фигура</label>
            <select id="sub" onchange="render()"></select>
        </div>
    </div>

    <div class="content-card">
        <div class="visual-stage" id="visual"></div>
        <h2 id="title" style="color: var(--primary); margin: 0 0 10px 0;"></h2>
        <p id="desc" style="color: #94a3b8; line-height: 1.6;"></p>
        <div class="formula-grid" id="formulas"></div>
    </div>
</div>

<script>
const db = {
    tri: {
        eq: { name: "Равностранен триъгълник", desc: "Всички страни и ъгли ($60^\\circ$) са равни. Височина, медиана и ъглополовяща съвпадат.", forms: {"Лице": "S = \\frac{a^2\\sqrt{3}}{4}", "Височина": "h = \\frac{a\\sqrt{3}}{2}"}, draw: '<div style="width:0;height:0;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:86px solid var(--primary);"></div>' },
        right: { name: "Правоъгълен триъгълник", desc: "Притежава прав ъгъл. Страните биват катети и хипотенуза.", forms: {"Питагор": "a^2 + b^2 = c^2", "Лице": "S = \\frac{a \\cdot b}{2}"}, draw: '<div style="width:0;height:0;border-left:0;border-right:100px solid transparent;border-bottom:100px solid var(--accent);"></div>' },
        iso: { name: "Равнобедрен триъгълник", desc: "Две равни страни (бедра) и равни ъгли при основата.", forms: {"Периметър": "P = 2a + b", "Лице": "S = \\frac{b \\cdot h}{2}"}, draw: '<div style="width:0;height:0;border-left:40px solid transparent;border-right:40px solid transparent;border-bottom:100px solid #38bdf8;"></div>' },
        scalene: { name: "Разностранен триъгълник", desc: "Общ случай с различни страни. Използва се полупериметър $p = \\frac{a+b+c}{2}$.", forms: {"Херон": "S = \\sqrt{p(p-a)(p-b)(p-c)}", "Периметър": "P = a+b+c"}, draw: '<div style="width:0;height:0;border-left:20px solid transparent;border-right:80px solid transparent;border-bottom:70px solid #64748b;"></div>' }
    },
    quad: {
        sq: { name: "Квадрат", desc: "Правилен четириъгълник. Равни страни и прави ъгли.", forms: {"Лице": "S = a^2", "Диагонал": "d = a\\sqrt{2}"}, draw: '<div style="width:80px;height:80px;border:3px solid var(--primary);"></div>' },
        rect: { name: "Правоъгълник", desc: "Успоредник с прави ъгли. Диагоналите са равни и се разполовяват.", forms: {"Лице": "S = a \\cdot b", "Диагонал": "d = \\sqrt{a^2 + b^2}"}, draw: '<div style="width:110px;height:70px;border:3px solid var(--primary);"></div>' },
        rhom: { name: "Ромб", desc: "Успоредник с равни страни. Диагоналите са перпендикулярни.", forms: {"Лице": "S = \\frac{d_1 d_2}{2}", "Лице (височина)": "S = a \\cdot h"}, draw: '<div style="width:70px;height:70px;border:3px solid var(--accent);transform:rotate(45deg);"></div>' },
        par: { name: "Успоредник (Ромбоид)", desc: "Срещуположните страни са успоредни и равни.", forms: {"Лице": "S = a \\cdot h_a", "Периметър": "P = 2(a+b)"}, draw: '<div style="width:100px;height:60px;border:3px solid #38bdf8;transform:skew(-20deg);"></div>' },
        trap_iso: { name: "Равнобедрен Трапец", desc: "Трапец с равни бедра и равни ъгли при основите.", forms: {"Лице": "S = \\frac{a+b}{2}h"}, draw: '<div style="width:100px;height:0;border-bottom:60px solid var(--accent);border-left:20px solid transparent;border-right:20px solid transparent;"></div>' },
        trap_right: { name: "Правоъгълен Трапец", desc: "Едното бедро е перпендикулярно на основите и съвпада с височината.", forms: {"Лице": "S = \\frac{a+b}{2}h"}, draw: '<div style="width:100px;height:0;border-bottom:60px solid #f472b6;border-right:30px solid transparent;"></div>' },
        delt: { name: "Делтоид", desc: "Две двойки съседни равни страни.", forms: {"Лице": "S = \\frac{d_1 d_2}{2}"}, draw: '<div style="width:60px;height:90px;border:3px solid #ec4899;clip-path:polygon(50% 0%, 100% 30%, 50% 100%, 0% 30%);"></div>' }
    },
    poly: {
        hex: { name: "Правилен Шестоъгълник", desc: "Шест равни страни. Вътрешен ъгъл $120^\\circ$.", forms: {"Лице": "S = \\frac{3\\sqrt{3}}{2}a^2", "Периметър": "P = 6a"}, draw: '<div style="width:80px;height:46px;border-top:3px solid var(--primary);border-bottom:3px solid var(--primary);position:relative;"><div style="position:absolute;width:100%;height:100%;border-top:3px solid var(--primary);border-bottom:3px solid var(--primary);transform:rotate(60deg);top:0;left:0;"></div><div style="position:absolute;width:100%;height:100%;border-top:3px solid var(--primary);border-bottom:3px solid var(--primary);transform:rotate(-60deg);top:0;left:0;"></div></div>' }
    },
    circ: {
        full: { name: "Кръг", desc: "Всички точки на разстояние r от центъра.", forms: {"Лице": "S = \\pi r^2", "Обиколка": "L = 2\\pi r"}, draw: '<div style="width:90px;height:90px;border:3px solid var(--primary);border-radius:50%;"></div>' },
        sec: { name: "Кръгов сектор", desc: "Част от кръг, заградена от два радиуса и дъга.", forms: {"Лице": "S = \\frac{\\pi r^2 \\alpha}{360}"}, draw: '<div style="width:90px;height:90px;border:3px solid var(--accent);border-radius:50%;clip-path:polygon(50% 50%, 100% 0, 100% 100%);"></div>' }
    }
};

function updateSub() {
    const c = document.getElementById('cat').value;
    const s = document.getElementById('sub');
    s.innerHTML = "";
    for(let k in db[c]) {
        let o = document.createElement('option');
        o.value = k; o.innerText = db[c][k].name;
        s.appendChild(o);
    }
    render();
}

function render() {
    const c = document.getElementById('cat').value;
    const k = document.getElementById('sub').value;
    const item = db[c][k];
    document.getElementById('title').innerText = item.name;
    document.getElementById('desc').innerHTML = item.desc;
    document.getElementById('visual').innerHTML = item.draw;
    const f = document.getElementById('formulas');
    f.innerHTML = "";
    for(let l in item.forms) {
        f.innerHTML += `<div class="f-card"><span>${l}</span><div>$$${item.forms[l]}$$</div></div>`;
    }
    if(window.MathJax) MathJax.typesetPromise();
}

// Background Animation
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();
function animate() {
    ctx.fillStyle = 'rgba(11, 17, 32, 0.1)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    requestAnimationFrame(animate);
}
animate();
updateSub();
</script>
</body>
</html>
