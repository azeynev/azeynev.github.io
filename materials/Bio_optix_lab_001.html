<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>BioOptix Quantum v6.0</title>
    <style>
        :root { --neon: #00f2fe; --pink: #ff007a; --green: #00ff88; --bg: #020408; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: 0.5s; }
        
        /* NIGHT MODE CLASS */
        body.night-mode { background: #000; --neon: #0088ff; }
        body.night-mode .viewport { background: #111; border-color: #003366; }
        body.night-mode .snellen { color: #00ff88; text-shadow: 0 0 10px #00ff88; }

        .hud-header { height: 60px; border-bottom: 1px solid rgba(0,242,254,0.3); display: flex; align-items: center; padding: 0 20px; background: #000; justify-content: space-between; }
        .main-lab { flex: 1; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; padding: 20px; min-height: 0; position: relative; }
        
        .viewport { background: #fff; border-radius: 15px; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 4px solid #1a1f2e; transition: 0.5s; }
        
        /* GLAUCOMA OVERLAY */
        #glaucoma-mask {
            position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(circle, transparent 20%, black 70%);
            display: none; z-index: 10;
        }

        .snellen { color: #000; text-align: center; font-weight: 900; line-height: 0.8; transition: 0.1s; }
        .optics-box { background: #000; border-radius: 15px; border: 1px solid #30363d; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        .terminal { height: 280px; background: #0d1117; border-top: 2px solid var(--neon); display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; padding: 20px; }
        .card { background: var(--glass); border: 1px solid #30363d; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
        
        .btn { width: 100%; background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 5px; transition: 0.2s; font-size: 0.7rem; }
        .btn.active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); border: none; }
        .btn-special { border-color: var(--pink); color: var(--pink); }
        .btn-special.active { background: var(--pink); color: white; }

        input[type="range"] { width: 100%; accent-color: var(--neon); cursor: pointer; }
        .label { font-size: 0.6rem; color: var(--neon); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    </style>
</head>
<body onload="init()">

<div class="hud-header">
    <div style="color: var(--neon); font-size: 0.8rem; letter-spacing: 2px;">● SYSTEM QUANTUM v6.0</div>
    <div style="font-weight: bold;">BIOOPTIX <span id="mode-title" style="color:var(--neon)">LABORATORY</span></div>
    <div id="clock" style="color: var(--neon); font-family: monospace;">00:00:00</div>
</div>

<div class="main-lab">
    <div class="viewport" id="v-port">
        <div id="glaucoma-mask"></div>
        <div id="chart" class="snellen">
            <div style="font-size: 90px;">E</div>
            <div style="font-size: 60px;">F P</div>
            <div style="font-size: 40px;">T O Z</div>
            <div style="font-size: 25px;">L P E D</div>
            <div style="font-size: 15px;">P E C F D</div>
        </div>
    </div>
    <div class="optics-box">
        <canvas id="mainCanvas"></canvas>
    </div>
</div>

<div class="terminal">
    <div class="card">
        <span class="label">Патология на окото</span>
        <button id="b-n" class="btn active" onclick="setMode('normal', this)">NORMAL</button>
        <button id="b-m" class="btn" onclick="setMode('myopia', this)">MYOPIA (-)</button>
        <button id="b-h" class="btn" onclick="setMode('hyper', this)">HYPEROPIA (+)</button>
        <button id="b-a" class="btn" onclick="setMode('astig', this)">ASTIGMATISM</button>
    </div>

    <div class="card" style="text-align: center;">
        <span class="label">Оптична корекция</span>
        <div id="d-val" style="font-size: 3rem; font-weight: 900; color: var(--neon);">0.00</div>
        <input type="range" id="d-slider" min="-8" max="8" step="0.25" value="0" oninput="update()">
        <div style="margin-top: 15px; display: flex; gap: 5px;">
            <button class="btn btn-special" id="glaucomaBtn" onclick="toggleGlaucoma()">ГЛАУКОМА</button>
            <button class="btn btn-special" id="nightBtn" onclick="toggleNight()">НОЩЕН РЕЖИМ</button>
        </div>
    </div>

    <div class="card">
        <span class="label">Диагностичен лог</span>
        <div id="log" style="font-size: 0.75rem; color: #8b949e; margin-top: 10px; line-height: 1.4;">
            Готовност за диагностика. Използвайте бутоните за симулация на заболявания.
        </div>
    </div>
</div>

<script>
    let mode = 'normal';
    let isGlaucoma = false;
    let isNight = false;
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        window.addEventListener('resize', update);
        update();
    }

    function toggleGlaucoma() {
        isGlaucoma = !isGlaucoma;
        document.getElementById('glaucoma-mask').style.display = isGlaucoma ? 'block' : 'none';
        document.getElementById('glaucomaBtn').classList.toggle('active');
        update();
    }

    function toggleNight() {
        isNight = !isNight;
        document.body.classList.toggle('night-mode');
        document.getElementById('nightBtn').classList.toggle('active');
        document.getElementById('mode-title').innerText = isNight ? "DARK-EYE" : "QUANTUM";
        update();
    }

    function setMode(m, el) {
        mode = m;
        document.querySelectorAll('.btn').forEach(b => { if(!b.classList.contains('btn-special')) b.classList.remove('active')});
        el.classList.add('active');
        document.getElementById('d-slider').value = 0;
        update();
    }

    function update() {
        const d = parseFloat(document.getElementById('d-slider').value);
        document.getElementById('d-val').innerText = (d > 0 ? "+" : "") + d.toFixed(2);
        
        const chart = document.getElementById('chart');
        const log = document.getElementById('log');
        
        let blur = 0;
        if(mode === 'myopia') blur = Math.abs(15 + (d * 4));
        else if(mode === 'hyper') blur = Math.abs(12 - (d * 4));
        else if(mode === 'astig') blur = Math.abs(8 + (d * 2));
        else blur = Math.abs(d * 5);

        chart.style.filter = `blur(${blur}px)`;
        if(isGlaucoma) log.innerText = "CRITICAL: Напреднала глаукома. Загуба на периферия.";
        else log.innerText = "Диагностика на ретината активна. Търсете прецизен фокус.";
        
        draw(d);
    }

    function draw(d) {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        const cx = canvas.width / 2, cy = canvas.height / 2, r = 90;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // GRID
        ctx.strokeStyle = isNight ? 'rgba(0, 136, 255, 0.2)' : 'rgba(0, 242, 254, 0.1)';
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }

        let s = (mode === 'myopia') ? 1.3 : (mode === 'hyper') ? 0.85 : 1;
        
        // EYE
        ctx.beginPath();
        ctx.strokeStyle = '#30363d';
        ctx.lineWidth = 3;
        ctx.ellipse(cx, cy, r * s, r, 0, 0, Math.PI * 2);
        ctx.stroke();

        // RETINA
        ctx.beginPath();
        ctx.arc(cx + (r * s) - 5, cy, 30, Math.PI/2, -Math.PI/2, true);
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 5;
        ctx.stroke();

        let focalX = cx + (r * (mode === 'myopia' ? 0.6 : mode === 'hyper' ? 1.25 : 0.95)) - (d * 14);
        
        // BEAMS
        ctx.shadowBlur = isNight ? 20 : 10;
        ctx.shadowColor = isNight ? '#0088ff' : '#00f2fe';
        for(let i = -3; i <= 3; i++) {
            ctx.beginPath();
            ctx.strokeStyle = isNight ? `rgba(0, 136, 255, ${0.8 - Math.abs(i)*0.1})` : `rgba(0, 242, 254, ${0.6 - Math.abs(i)*0.1})`;
            ctx.lineWidth = 2;
            ctx.moveTo(cx - 300, cy + (i * 25));
            ctx.lineTo(cx - (r * 0.8), cy + (i * 15));
            ctx.lineTo(focalX, cy);
            if(mode === 'astig') ctx.lineTo(focalX + 30, cy + (i*10));
            ctx.stroke();
        }

        // DOT
        ctx.beginPath();
        ctx.arc(focalX, cy, 8, 0, Math.PI * 2);
        ctx.fillStyle = (Math.abs(focalX - (cx + r * s)) < 15) ? '#00ff88' : '#ff007a';
        ctx.fill();
    }
</script>
</body>
</html>
