<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>BioOptix Quantum v8.0 - Prescription Mode</title>
    <style>
        :root { --neon: #00f2fe; --pink: #ff007a; --green: #00ff88; --bg: #020408; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .hud-header { height: 60px; border-bottom: 1px solid rgba(0,242,254,0.3); display: flex; align-items: center; padding: 0 20px; background: #000; justify-content: space-between; }
        .main-lab { flex: 1; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; padding: 20px; min-height: 0; position: relative; }
        
        .viewport { background: #fff; border-radius: 15px; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 4px solid #1a1f2e; }
        #cataract-layer { position: absolute; inset: 0; pointer-events: none; background: rgba(255,255,255,0.6); filter: blur(10px); display: none; z-index: 5; }
        #glaucoma-mask { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 20%, black 75%); display: none; z-index: 10; }
        .snellen { color: #000; text-align: center; font-weight: 900; line-height: 0.8; z-index: 1; }

        .optics-box { background: #000; border-radius: 15px; border: 1px solid #30363d; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }

        /* PRESCRIPTION MODAL */
        #prescription {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; background: #fff; color: #000; padding: 30px; border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,242,254,0.5); display: none; z-index: 100;
            border: 5px double #000;
        }

        .terminal { height: 320px; background: #0d1117; border-top: 2px solid var(--neon); display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; padding: 20px; }
        .card { background: var(--glass); border: 1px solid #30363d; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
        
        .btn { width: 100%; background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 5px; font-size: 0.7rem; }
        .btn.active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); border: none; }
        .btn-rx { background: var(--green); color: #000; border: none; margin-top: 10px; font-size: 0.9rem; height: 50px; }

        input[type="range"] { width: 100%; accent-color: var(--neon); cursor: pointer; }
        .label { font-size: 0.6rem; color: var(--neon); text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body onload="init()">

<div id="prescription">
    <h2 style="text-align:center; border-bottom: 2px solid #000; padding-bottom:10px;">ОПТИЧНА РЕЦЕПТА</h2>
    <p><strong>Дата:</strong> <span id="rx-date"></span></p>
    <p><strong>Патология:</strong> <span id="rx-mode"></span></p>
    <p><strong>Корекция (SPH):</strong> <span id="rx-val"></span></p>
    <p><strong>Допълнителни находки:</strong> <span id="rx-extra"></span></p>
    <div style="margin-top:30px; border-top: 1px dashed #000; padding-top:10px; font-style:italic; font-size: 0.8rem;">
        Издадено от BioOptix Quantum Engine
    </div>
    <button onclick="closeRx()" style="width:100%; margin-top:20px; padding:10px; cursor:pointer;">ЗАТВОРИ</button>
</div>

<div class="hud-header">
    <div style="color: var(--neon); font-size: 0.8rem;">● LAB_READY</div>
    <div style="font-weight: bold; letter-spacing: 2px;">BIOOPTIX <span style="color:var(--neon)">QUANTUM v8.0</span></div>
    <div id="clock" style="color: var(--neon); font-family: monospace;">00:00:00</div>
</div>

<div class="main-lab">
    <div class="viewport">
        <div id="cataract-layer"></div>
        <div id="glaucoma-mask"></div>
        <div id="chart" class="snellen">
            <div style="font-size: 80px;">E</div>
            <div style="font-size: 50px;">F P</div>
            <div style="font-size: 35px;">T O Z</div>
            <div style="font-size: 25px;">L P E D</div>
        </div>
    </div>
    <div class="optics-box"><canvas id="mainCanvas"></canvas></div>
</div>

<div class="terminal">
    <div class="card">
        <span class="label">Тип Око</span>
        <button id="b-n" class="btn active" onclick="setMode('normal', this)">NORMAL</button>
        <button id="b-m" class="btn" onclick="setMode('myopia', this)">MYOPIA</button>
        <button id="b-h" class="btn" onclick="setMode('hyper', this)">HYPEROPIA</button>
        <button id="b-a" class="btn" onclick="setMode('astig', this)">ASTIGMATISM</button>
    </div>

    <div class="card" style="text-align: center;">
        <span class="label">Оптично Напасване</span>
        <div id="d-val" style="font-size: 2.5rem; font-weight: 900; color: var(--neon); margin:10px 0;">0.00 D</div>
        <input type="range" id="d-slider" min="-8" max="8" step="0.25" value="0" oninput="update()">
        <button class="btn btn-rx" onclick="generateRx()">ИЗДАЙ РЕЦЕПТА</button>
    </div>

    <div class="card">
        <span class="label">Допълнителни Симулации</span>
        <button class="btn" id="catBtn" onclick="toggle('cataract')">КАТАРАКТА</button>
        <button class="btn" id="glauBtn" onclick="toggle('glaucoma')">ГЛАУКОМА</button>
        <button class="btn" onclick="location.reload()">НУЛИРАЙ СИСТЕМАТА</button>
    </div>
</div>

<script>
    let mode = 'нормално зрение';
    let isCat = false, isGlau = false;
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        update();
    }

    function toggle(type) {
        if(type === 'cataract') { 
            isCat = !isCat; 
            document.getElementById('cataract-layer').style.display = isCat ? 'block' : 'none';
            document.getElementById('catBtn').classList.toggle('active');
        } else { 
            isGlau = !isGlau; 
            document.getElementById('glaucoma-mask').style.display = isGlau ? 'block' : 'none';
            document.getElementById('glauBtn').classList.toggle('active');
        }
        update();
    }

    function setMode(m, el) {
        mode = el.innerText;
        document.querySelectorAll('.btn').forEach(b => { if(!b.id.includes('Btn')) b.classList.remove('active')});
        el.classList.add('active');
        update();
    }

    function update() {
        const d = parseFloat(document.getElementById('d-slider').value);
        document.getElementById('d-val').innerText = (d > 0 ? "+" : "") + d.toFixed(2) + " D";
        
        let blur = 1;
        if(mode.includes('MYOPIA')) blur = Math.abs(15 + (d * 4));
        else if(mode.includes('HYPER')) blur = Math.abs(12 - (d * 4));
        else blur = Math.abs(d * 5);
        
        document.getElementById('chart').style.filter = `blur(${blur}px)`;
        draw(d);
    }

    function generateRx() {
        document.getElementById('rx-date').innerText = new Date().toLocaleDateString();
        document.getElementById('rx-mode').innerText = mode;
        document.getElementById('rx-val').innerText = document.getElementById('d-val').innerText;
        let extras = [];
        if(isCat) extras.push("Катаракта (мътна леща)");
        if(isGlau) extras.push("Глаукома (тунелно зрение)");
        document.getElementById('rx-extra').innerText = extras.length ? extras.join(", ") : "Няма";
        document.getElementById('prescription').style.display = 'block';
    }

    function closeRx() { document.getElementById('prescription').style.display = 'none'; }

    function draw(d) {
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const cx = canvas.width/2, cy = canvas.height/2, r = 80;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        
        // EYE MODEL
        ctx.beginPath(); ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
        ctx.ellipse(cx, cy, r*(mode.includes('MYOPIA')?1.3:0.9), r, 0, 0, Math.PI*2); ctx.stroke();
        
        // RETINA
        ctx.beginPath(); ctx.arc(cx + (r*(mode.includes('MYOPIA')?1.3:0.9)) - 5, cy, 25, Math.PI/2, -Math.PI/2, true);
        ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.stroke();

        // FOCUS POINT
        let focalX = cx + r - (d * 10);
        ctx.beginPath(); ctx.arc(focalX, cy, 6, 0, Math.PI*2);
        ctx.fillStyle = '#ff007a'; ctx.fill();
    }
</script>
</body>
</html>
