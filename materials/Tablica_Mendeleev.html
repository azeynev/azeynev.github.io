            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #1565c0, #0d47a1);
            color: white;
            padding: 25px 40px;
            text-align: center;
            border-bottom: 5px solid #ffd600;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        
        .main-content {
            display: flex;
            padding: 20px;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .table-section {
            flex: 3;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
            margin: 20px auto;
            max-width: 1200px;
            position: relative;
        }
        
        .element {
            background: white;
            border: 1px solid #ddd;
            border-radius: 3px;
            padding: 8px 3px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
        }
        
        .element:hover {
            transform: scale(1.08);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        
        .element.selected {
            transform: scale(1.1);
            z-index: 20;
            box-shadow: 0 0 0 3px #ffd600, 0 5px 20px rgba(255,214,0,0.4);
            border-color: #ffd600;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 3px #ffd600; }
            50% { box-shadow: 0 0 0 5px #ffd600; }
            100% { box-shadow: 0 0 0 3px #ffd600; }
        }
        
        .element-number {
            font-size: 0.6rem;
            font-weight: bold;
            position: absolute;
            top: 2px;
            left: 3px;
            color: #555;
        }
        
        .element-symbol {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 2px 0;
            color: #222;
        }
        
        .element-name {
            font-size: 0.5rem;
            color: #666;
            margin-top: 1px;
        }
        
        .element-mass {
            font-size: 0.5rem;
            color: #777;
            position: absolute;
            bottom: 2px;
            right: 3px;
        }

        /* Период 1 */
        [data-position="1-1"] { grid-column: 1; grid-row: 1; }
        [data-position="1-18"] { grid-column: 18; grid-row: 1; }

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-atom"></i> Периодична таблица на елементите</h1>
            <div class="subtitle">Пълна версия с всички 118 елемента</div>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Търси елемент по име, символ или номер...">
                <i class="fas fa-search"></i>
            </div>
            
            <div class="controls">
                <button class="control-btn active" id="btn-all">
                    <i class="fas fa-border-all"></i> Всички
                </button>
                <button class="control-btn" id="btn-metals">
                    <i class="fas fa-gem"></i> Метали
                </button>
                <button class="control-btn" id="btn-nonmetals">
                    <i class="fas fa-fire"></i> Неметали
                </button>
                <button class="control-btn" id="btn-gases">
                    <i class="fas fa-wind"></i> Газове
                </button>
            </div>
        </header>
        
        <div class="main-content">
            <div class="table-section">
                <div class="periodic-table" id="periodic-table">
                    <!-- Тук ще се генерира цялата таблица -->
                </div>
            </div>
            
            <div class="info-section">
                <div class="element-header">
                    <div class="element-icon" id="element-icon">
                        H
                    </div>
                    <div class="element-title">
                        <h2 id="element-name">Водород</h2>
                        <div class="element-category" id="element-category">Неметал</div>
                    </div>
                </div>
                
                <div class="element-details">
                    <div class="detail-card">
                        <div class="detail-label">
                            <i class="fas fa-hashtag"></i> Атомен номер
                        </div>
                        <div class="detail-value" id="atomic-number">1</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">
                            <i class="fas fa-weight-hanging"></i> Атомна маса
                        </div>
                        <div class="detail-value" id="atomic-mass">1.008</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">
                            <i class="fas fa-layer-group"></i> Период
                        </div>
                        <div class="detail-value" id="period">1</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">
                            <i class="fas fa-arrows-alt-h"></i> Група
                        </div>
                        <div class="detail-value" id="group">1</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">
                            <i class="fas fa-snowflake"></i> Състояние
                        </div>
                        <div class="detail-value" id="state">Газ</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">
                            <i class="fas fa-thermometer-half"></i> Топене
                        </div>
                        <div class="detail-value" id="melting-point">-259°C</div>

            { number: 103, symbol: "Lr", name: "Лоренций", mass: "[262]", category: "actinide", period: 7, group: 3, state: "Твърдо", melting: "1627°C", electronConfig: "[Rn] 5f¹⁴ 6d¹ 7s²", applications: ["Научни изследвания"] }
        ];

        let selectedElement = elements[0];
        let currentFilter = 'all';

        function init() {
            createPeriodicTable();
            setupEventListeners();
            selectElement(selectedElement);
        }

        function createPeriodicTable() {
            const table = document.getElementById('periodic-table');
            table.innerHTML = '';
            
            // Празни клетки за правилното оформление
            for (let row = 1; row <= 10; row++) {
                for (let col = 1; col <= 18; col++) {
                    let element = null;
                    let position = '';
                    
                    // Определяне на елемента според позицията
                    if (row <= 7) {
                        // Основна таблица
                        element = elements.find(e => e.period === row && e.group === col);
                        position = `${row}-${col}`;
                    } else if (row === 9) {
                        // Лантаниди
                        const lanthanideIndex = col - 3;
                        if (lanthanideIndex >= 1 && lanthanideIndex <= 15) {
                            const lanthanideNumbers = [57, 58, 59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71];
                            if (lanthanideIndex <= lanthanideNumbers.length) {
                                element = elements.find(e => e.number === lanthanideNumbers[lanthanideIndex - 1]);
                            }
                        }
                        position = `lanthanide-${col-3}`;
                    } else if (row === 10) {
                        // Актиниди
                        const actinideIndex = col - 3;
                        if (actinideIndex >= 1 && actinideIndex <= 15) {
                            const actinideNumbers = [89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102, 103];
                            if (actinideIndex <= actinideNumbers.length) {
                                element = elements.find(e => e.number === actinideNumbers[actinideIndex - 1]);
                            }
                        }
                        position = `actinide-${col-3}`;
                    }
                    
                    const cell = document.createElement('div');
                    
                    if (element) {
                        cell.className = `element ${element.category}`;
                        cell.setAttribute('data-number', element.number);
                        cell.setAttribute('data-position', position);
                        cell.innerHTML = `
                            <div class="element-number">${element.number}</div>
                            <div class="element-symbol">${element.symbol}</div>
                            <div class="element-name">${element.name}</div>
                            <div class="element-mass">${element.mass}</div>
                        `;
                        
                        cell.onclick = () => selectElement(element);
                    } else if (row === 9 && col === 1) {
                        // Етикет за лантаниди
                        cell.className = 'lanthanide-label';
                        cell.textContent = 'Лантаниди';
                        cell.style.gridColumn = '1 / span 3';
                        cell.style.gridRow = '9';
                    } else if (row === 10 && col === 1) {
                        // Етикет за актиниди
                        cell.className = 'actinide-label';
                        cell.textContent = 'Актиниди';
                        cell.style.gridColumn = '1 / span 3';
                        cell.style.gridRow = '10';
                    } else {
                        cell.className = 'empty';
                    }
                    
                    if (position) {
                        cell.setAttribute('data-position', position);
                    }
                    
                    table.appendChild(cell);
                }
            }
        }

        function selectElement(element) {
            selectedElement = element;
            
            document.querySelectorAll('.element').forEach(el => {
                el.classList.remove('selected');
            });
            
            const elementCell = document.querySelector(`.element[data-number="${element.number}"]`);
            if (elementCell) {
                elementCell.classList.add('selected');
            }
            
            updateElementInfo(element);
        }

        function updateElementInfo(element) {
            document.getElementById('element-icon').textContent = element.symbol;
            document.getElementById('element-name').textContent = element.name;
            document.getElementById('atomic-number').textContent = element.number;
            document.getElementById('atomic-mass').textContent = element.mass;
            document.getElementById('period').textContent = element.period;
            document.getElementById('group').textContent = element.group;
            document.getElementById('state').textContent = element.state;
            document.getElementById('melting-point').textContent = element.melting;
            document.getElementById('electron-config').textContent = element.electronConfig;
            
            const categories = {
                'alkali-metal': 'Алкален метал',
                'alkaline-earth': 'Алкалоземен метал',
                'transition-metal': 'Преходен метал',
                'post-transition': 'Пост-преходен метал',
                'metalloid': 'Металоид',
                'nonmetal': 'Неметал',
                'halogen': 'Халоген',
                'noble-gas': 'Благороден газ',
                'lanthanide': 'Лантанид',
                'actinide': 'Актинид'
            };
            
            document.getElementById('element-category').textContent = categories[element.category] || element.category;
            
            const applicationsContainer = document.getElementById('applications');
            applicationsContainer.innerHTML = '';
            
            if (Array.isArray(element.applications)) {
                element.applications.forEach(app => {
                    const appTag = document.createElement('div');
                    appTag.className = 'app-tag';
                    appTag.textContent = app;
                    applicationsContainer.appendChild(appTag);
                });
            }
        }

        function setupEventListeners() {
            // Търсене
            document.getElementById('search-input').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                
                if (searchTerm.length >= 1) {
                    const foundElement = elements.find(e => 
                        e.name.toLowerCase().includes(searchTerm) || 
                        e.symbol.toLowerCase().includes(searchTerm) ||
                        e.number.toString().includes(searchTerm)
                    );
                    
                    if (foundElement) {
                        selectElement(foundElement);
                    }
                }
            });
            
            // Филтриране
            document.getElementById('btn-all').onclick = () => {
                setActiveFilter('all');
                showAllElements();
            };
            
            document.getElementById('btn-metals').onclick = () => {
                setActiveFilter('metals');
                showElementsByCategory(['alkali-metal', 'alkaline-earth', 'transition-metal', 'post-transition']);
            };
            
            document.getElementById('btn-nonmetals').onclick = () => {
                setActiveFilter('nonmetals');
                showElementsByCategory(['nonmetal', 'halogen', 'noble-gas', 'metalloid']);
            };
            
            document.getElementById('btn-gases').onclick = () => {
                setActiveFilter('gases');
                showElementsByCategory(['noble-gas', 'halogen']);
            };
        }

        function showAllElements() {
            document.querySelectorAll('.element').forEach(el => {
                el.style.opacity = '1';
            });
        }

        function showElementsByCategory(categories) {
            document.querySelectorAll('.element').forEach(el => {
                const elementNumber = parseInt(el.getAttribute('data-number'));
                const element = elements.find(e => e.number === elementNumber);
                
                if (element && categories.includes(element.category)) {
                    el.style.opacity = '1';
                } else {
                    el.style.opacity = '0.3';
                }
            });
        }

        function setActiveFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${filter}`).classList.add('active');
        }

        window.onload = init;
    </script>
